# ============================================================================
# ClassWatch CI
#
# 三条独立流水线，对应三种失败面：
#   api     —— Go 代码：格式、vet、单测、集成测试（真实 PostgreSQL + Redis）
#   web     —— 三个前端：lint、格式、类型、单测、构建
#   compose —— 基础设施编排文件的有效性与镜像可构建性
#
# 原则（任务书 §64/§83）：不允许用 mock 代替集成测试；
# 集成测试必须连真实 PostgreSQL，因此在 CI 中通过 service container 提供。
# ============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 中使用的开发凭据，仅存在于 runner 内部，绝不用于生产。
  POSTGRES_USER: classwatch
  POSTGRES_PASSWORD: classwatch_dev_password
  POSTGRES_DB: classwatch_test

jobs:
  api:
    name: API · Go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U classwatch -d classwatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: 依赖校验
        run: go mod verify

      - name: 格式检查（gofmt）
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 单元测试 + 集成测试
        env:
          APP_ENV: test
          DATABASE_URL: postgres://classwatch:classwatch_dev_password@localhost:5432/classwatch_test?sslmode=disable
          TEST_DATABASE_URL: postgres://classwatch:classwatch_dev_password@localhost:5432/classwatch_test?sslmode=disable
          # 限流测试需要真实 Redis；未设置时相关用例会 Skip，CI 中必须设置以免假绿。
          TEST_REDIS_ADDR: localhost:6379
          REDIS_ADDR: localhost:6379
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: classwatch_dev_livekit_secret_32b
          LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_API_URL: http://localhost:7880
        # 集成测试若缺少 TEST_DATABASE_URL 会自行 Skip；
        # CI 中该变量已注入，因此跳过即意味着配置错误，用 -count=1 防止缓存假绿。
        # -p 1：所有集成测试共用一个 PostgreSQL service，包级并行会互相干扰
        # （例如某个用例临时调整 ACTIVE 管理员集合时，另一个包同时在数管理员）。
        run: go test -p 1 ./... -count=1

  web:
    name: Web · Vue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建三个前端
        run: pnpm build

  compose:
    name: Infra · Compose & Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 校验 compose 文件（缺失 .env 时用模板生成）
        run: |
          cp .env.example .env
          docker compose config -q

      - name: 构建 API 镜像
        run: docker build -t classwatch-api:ci services/api
